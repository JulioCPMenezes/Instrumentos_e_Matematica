name: CI/CD - Instrumentos e Matematica

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI - Testes e build
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Executar testes automatizados
        run: npm test

      - name: Gerar versao de producao
        run: npm run build

      - name: Otimizar MP4 usados como audio na publicacao
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          shopt -s nullglob
          files=(dist/public/assets/audio/instrumentos/*.mp4)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum arquivo MP4 encontrado para otimizar" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            temp="${file%.mp4}.audio.mp4"
            ffmpeg -hide_banner -loglevel error -nostdin -y -i "$file" -map 0:a:0 -vn -c:a aac -b:a 96k "$temp"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$temp" | grep -qx aac
            mv "$temp" "$file"
          done
          du -sh dist

      - name: Verificar arquivos da publicacao
        run: |
          test -s dist/index.html
          test -s dist/src/main.js
          test -s dist/public/favicon.svg
          test -s "dist/public/assets/models/man head 3d model.glb"

      - name: Enviar artefato do GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: CD - Publicar site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
